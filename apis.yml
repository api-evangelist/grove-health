name: Grove Health
description: 'Grove Health (Grove Medical Inc.) is a North American B2B healthcare
  supplies distributor operating an online catalog covering medical equipment and
  consumables, including nursing supplies, diagnostics, wound care, incontinence products,
  examination gloves, respiratory equipment, and related healthcare items. The company
  serves healthcare facilities and providers through a self-service e-commerce storefront.
  It has been backed by General Catalyst since 2021. No public API, developer program,
  or machine-readable interface was found during enrichment; this profile captures
  the company identity and its public web surface.'
